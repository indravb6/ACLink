<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AC Control</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    button {
      padding: 20px 40px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>

<body>

  <button id="toggle">Loading...</button>

  <script>
    const button = document.getElementById("toggle");

    function updateButton(isOn) {
      button.textContent = isOn ? "ON" : "OFF";
    }

    async function loadStatus() {
      try {
        const response = await fetch("/api/ac/status", {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error("Failed to get AC status");
        }

        const status = await response.text();

        updateButton(status.trim() === "1");
      } catch (error) {
        console.error(error);
        button.textContent = "ERROR";
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;

      try {
        const response = await fetch("/api/ac/toggle", {
          method: "POST",
        });

        if (!response.ok) {
          throw new Error("Failed to toggle AC");
        }

        const data = await response.json();

        updateButton(data.on);
      } catch (error) {
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });

    // Load state from Node.js memory
    loadStatus();
  </script>

</body>

</html>
