<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AC Link</title>

  <link rel="icon" href="data:image/svg+xml,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <text y='.9em' font-size='90'>❄️</text>
      </svg>" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    const MAX_TEMPERATURE = 25;
    const MIN_TEMPERATURE = 16;

    let data = {};

    function render() {
      document.querySelector("#current-temperature").textContent =
        data.currentCondition.temperature === -1
          ? "??"
          : data.currentCondition.temperature;

      document.querySelector("#on-state").style.display =
        data.settings.on ? "flex" : "none";

      document.querySelector("#off-state").style.display =
        data.settings.on ? "none" : "flex";

      document.querySelector("#power-button").textContent =
        data.settings.on ? "Turn Off" : "Turn On";

      document.querySelector("#target-temperature").textContent =
        data.settings.targetTemperature === -1
          ? "??"
          : data.settings.targetTemperature;

      document.querySelector("#increase-temperature").disabled =
        data.settings.targetTemperature >= MAX_TEMPERATURE;

      document.querySelector("#decrease-temperature").disabled =
        data.settings.targetTemperature <= MIN_TEMPERATURE;


      // Fan speed
      document.querySelectorAll("input[name='fan']").forEach((input) => {
        const id = input.nextElementSibling.id;

        input.checked =
          id === `fan-${data.settings.fanSpeed}`;
      });


      // Mode
      document.querySelectorAll("input[name='mode']").forEach((input) => {
        const id = input.nextElementSibling.id;

        input.checked =
          id === `mode-${data.settings.mode}`;
      });


      // Swing
      const swingIcon =
        document.querySelector("#swing-selected-icon");

      if (swingIcon && data.settings.swing) {
        swingIcon.src =
          `/icons/swing-${data.settings.swing}.svg`;
      }

      document.querySelector("#current-humidity").textContent =
        data.currentCondition.humidity === -1
          ? "??"
          : data.currentCondition.humidity;

      document.querySelector("#current-updated").textContent =
        new Date(data.currentCondition.timestamp).toLocaleTimeString();
    }


    function updateData(newData) {
      data = newData;

      fetch("/api/state", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(newData.settings),
      })
        .then(fetchData)
        .catch((error) => {
          console.error("Error updating data:", error);
        });
    }


    function fetchData() {
      fetch("/api/state")
        .then((response) => response.json())
        .then((json) => {
          data = json;
          render();
        })
        .catch((error) => {
          console.error("Error fetching data:", error);
        });
    }


    function init() {

      // Power
      document
        .querySelector("#power-button")
        .addEventListener("click", () => {
          data.settings.on = !data.settings.on;
          updateData(data);
        });


      // Increase temperature
      document
        .querySelector("#increase-temperature")
        .addEventListener("click", () => {
          data.settings.targetTemperature += 1;
          updateData(data);
        });


      // Decrease temperature
      document
        .querySelector("#decrease-temperature")
        .addEventListener("click", () => {
          data.settings.targetTemperature -= 1;
          updateData(data);
        });


      // Fan
      document
        .querySelectorAll("input[name='fan']")
        .forEach((input) => {
          input.addEventListener("change", (event) => {

            data.settings.fanSpeed =
              event.target.nextElementSibling.id
                .replace("fan-", "");

            updateData(data);
          });
        });


      // Mode
      document
        .querySelectorAll("input[name='mode']")
        .forEach((input) => {
          input.addEventListener("change", (event) => {

            data.settings.mode =
              event.target.nextElementSibling.id
                .replace("mode-", "");

            updateData(data);
          });
        });


      // Swing dropdown
      const dropdown =
        document.getElementById("swing-dropdown");

      const trigger =
        document.getElementById("swing-trigger");

      const menu =
        document.getElementById("swing-menu");

      const chevron =
        document.getElementById("swing-chevron");

      const selectedIcon =
        document.getElementById("swing-selected-icon");


      trigger.addEventListener("click", (event) => {
        event.stopPropagation();

        menu.classList.toggle("hidden");
        chevron.classList.toggle("rotate-180");
      });


      menu.addEventListener("click", (event) => {

        const option =
          event.target.closest(".swing-option");

        if (!option) return;

        selectedIcon.src =
          option.dataset.icon;

        data.settings.swing =
          option.dataset.value;

        menu.classList.add("hidden");
        chevron.classList.remove("rotate-180");

        updateData(data);
      });


      // Close dropdown when clicking outside
      document.addEventListener("click", (event) => {

        if (!dropdown.contains(event.target)) {
          menu.classList.add("hidden");
          chevron.classList.remove("rotate-180");
        }

      });
    }


    document.addEventListener("DOMContentLoaded", () => {
      init();
      fetchData();

      setInterval(fetchData, 1000);
    });
  </script>
</head>


<body class="min-h-screen bg-cover bg-center bg-fixed"
  style="background-image: url('/bg.jpg');">

  <div class="fixed inset-0 bg-slate-950/35"></div>


  <main class="relative flex min-h-screen items-center justify-center p-4">

    <div class="w-full max-w-md overflow-visible rounded-3xl
             border border-white/30
             bg-white/70
             shadow-2xl
             backdrop-blur-xl">

      <!-- Header -->
      <header class="flex items-center justify-between px-6 pt-6">

        <div class="flex items-center gap-3">

          <div class="flex h-11 w-11 items-center justify-center
                   rounded-2xl bg-sky-500/10 text-xl">
            ❄️
          </div>

          <div>
            <h1 class="text-lg font-bold text-slate-900">
              AC Link
            </h1>

            <p class="text-xs text-slate-500">
              Smart AC Controller
            </p>
          </div>

        </div>


        <div class="flex items-center gap-2 rounded-full
                 bg-white/70 px-3 py-1.5
                 text-xs text-slate-500">

          <span class="h-2 w-2 rounded-full bg-emerald-500"></span>

          Connected

        </div>

      </header>


      <!-- Current Temperature -->
      <section class="px-6 pb-5 pt-8 text-center">

        <p class="text-sm font-medium text-slate-500">
          Current temperature
        </p>

        <div class="mt-1 text-7xl font-bold
              tracking-tight text-slate-900">

          <span id="current-temperature">
            ??
          </span>

          <span class="ml-1 text-3xl font-medium text-slate-400">
            °C
          </span>

        </div>

        <!-- Humidity -->
        <div class="mt-1 flex items-center justify-center gap-1.5
              text-sm text-slate-500">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            class="h-4 w-4 text-sky-500">

            <path
              d="M12 2.5C12 2.5 5.5 10 5.5 15.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z" />

          </svg>

          <span id="current-humidity">
            ??
          </span>

          <span>%</span>

          <span class="text-slate-400">
            humidity
          </span>

        </div>

        <!-- Last Updated -->
        <div class="mt-2 text-xs text-slate-400">
          Updated <span id="current-updated">--</span>
        </div>

      </section>


      <!-- Power -->
      <section class="px-6">

        <div class="flex items-center justify-between gap-4">

          <!-- ON -->
          <div class="flex items-center gap-3" id="on-state">

            <div class="flex h-10 w-10 items-center justify-center
                     rounded-full
                     bg-emerald-100
                     text-emerald-600">

              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                class="h-5 w-5">
                <path d="M12 2v10" />
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
              </svg>

            </div>

            <div>

              <p class="text-sm font-semibold text-slate-900">
                AC is ON
              </p>

              <p class="text-xs text-slate-500">
                Currently cooling
              </p>

            </div>

          </div>


          <!-- OFF -->
          <div class="flex items-center gap-3" id="off-state">

            <div class="flex h-10 w-10 items-center justify-center
                     rounded-full
                     bg-slate-100
                     text-slate-500">

              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                class="h-5 w-5">
                <path d="M12 2v10" />
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
              </svg>

            </div>

            <div>

              <p class="text-sm font-semibold text-slate-900">
                AC is OFF
              </p>

              <p class="text-xs text-slate-500">
                Currently turned off
              </p>

            </div>

          </div>


          <!-- Power button -->
          <button id="power-button" class="rounded-xl
                   border border-slate-200
                   bg-white
                   px-4 py-2.5
                   text-sm font-semibold
                   text-slate-700
                   shadow-sm
                   transition
                   hover:border-slate-300
                   hover:bg-slate-50
                   active:scale-[0.97]">
            Turn Off
          </button>

        </div>

      </section>


      <!-- Target Temperature -->
      <section class="px-6 pt-4">

        <div class="rounded-2xl
                 border border-white/50
                 bg-white/55
                 p-4">

          <p class="mb-3 text-xs font-medium text-slate-500">
            Target temperature
          </p>


          <div class="flex items-center justify-between">

            <button id="decrease-temperature" class="flex h-11 w-11 items-center justify-center
                     rounded-xl
                     bg-white/80
                     text-xl text-slate-700
                     shadow-sm
                     transition
                     hover:bg-white
                     active:scale-95
                     disabled:opacity-50">
              −
            </button>


            <div class="text-3xl font-bold text-slate-900">

              <span id="target-temperature">
                ??
              </span>

              <span class="ml-1 text-base font-medium text-slate-400">
                °C
              </span>

            </div>


            <button id="increase-temperature" class="flex h-11 w-11 items-center justify-center
                     rounded-xl
                     bg-white/80
                     text-xl text-slate-700
                     shadow-sm
                     transition
                     hover:bg-white
                     active:scale-95
                     disabled:opacity-50">
              +
            </button>

          </div>

        </div>

      </section>

      <!-- Mode & Swing -->
      <section class="grid grid-cols-5 gap-1 px-6 pt-4">

        <!-- Cool -->
        <label>
          <input type="radio" name="mode" class="peer sr-only" />

          <div id="mode-cool" class="flex h-full cursor-pointer flex-col
             items-center justify-center
             rounded-xl px-1 py-2.5
             text-center
             text-xs font-medium
             text-slate-500
             transition
             peer-checked:bg-white
             peer-checked:text-slate-900
             peer-checked:shadow-sm">
            <span class="mb-1 text-base leading-none">❄️</span>
            Cool
          </div>
        </label>


        <!-- Auto -->
        <label>
          <input type="radio" name="mode" class="peer sr-only" />

          <div id="mode-auto" class="flex h-full cursor-pointer flex-col
             items-center justify-center
             rounded-xl px-1 py-2.5
             text-center
             text-xs font-medium
             text-slate-500
             transition
             peer-checked:bg-white
             peer-checked:text-slate-900
             peer-checked:shadow-sm">
            <span class="mb-1 text-base leading-none">↻</span>
            Auto
          </div>
        </label>


        <!-- Dry -->
        <label>
          <input type="radio" name="mode" class="peer sr-only" />

          <div id="mode-dry" class="flex h-full cursor-pointer flex-col
             items-center justify-center
             rounded-xl px-1 py-2.5
             text-center
             text-xs font-medium
             text-slate-500
             transition
             peer-checked:bg-white
             peer-checked:text-slate-900
             peer-checked:shadow-sm">
            <span class="mb-1 text-base leading-none">💧</span>
            Dry
          </div>
        </label>


        <!-- Fan -->
        <label>
          <input type="radio" name="mode" class="peer sr-only" />

          <div id="mode-fan" class="flex h-full cursor-pointer flex-col
             items-center justify-center
             rounded-xl px-1 py-2.5
             text-center
             text-xs font-medium
             text-slate-500
             transition
             peer-checked:bg-white
             peer-checked:text-slate-900
             peer-checked:shadow-sm">
            <span class="mb-1 text-base leading-none">💨</span>
            Fan
          </div>
        </label>


        <!-- Swing -->
        <div id="swing-dropdown" class="relative">

          <button type="button" id="swing-trigger" class="flex h-full w-full
             items-center justify-center
             rounded-xl
             bg-white/70
             backdrop-blur
             hover:bg-white">

            <img id="swing-selected-icon" src="/icons/swing-1-5.svg"
              class="h-8 w-8" alt="" />

            <svg id="swing-chevron" class="absolute right-1 h-3.5 w-3.5
               text-gray-400 transition-transform" viewBox="0 0 20 20"
              fill="none">
              <path d="M6 8L10 12L14 8" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>

          </button>


          <!-- Swing dropdown -->
          <div id="swing-menu" class="absolute bottom-full right-0 z-50 mb-2 hidden
             w-20 overflow-hidden rounded-xl
             border border-black/10
             bg-white/95 p-1.5
             shadow-xl backdrop-blur">

            <button type="button" data-value="1" data-icon="/icons/swing-1.svg"
              class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-1.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="2" data-icon="/icons/swing-2.svg"
              class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-2.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="3" data-icon="/icons/swing-3.svg"
              class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-3.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="4" data-icon="/icons/swing-4.svg"
              class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-4.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="5" data-icon="/icons/swing-5.svg"
              class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-5.svg" class="h-8 w-8" alt="" />
            </button>

            <div class="my-1 border-t border-gray-100"></div>

            <button type="button" data-value="1-3"
              data-icon="/icons/swing-1-3.svg" class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-1-3.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="2-4"
              data-icon="/icons/swing-2-4.svg" class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-2-4.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="3-5"
              data-icon="/icons/swing-3-5.svg" class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-3-5.svg" class="h-8 w-8" alt="" />
            </button>

            <button type="button" data-value="1-5"
              data-icon="/icons/swing-1-5.svg" class="swing-option flex w-full
               items-center justify-center
               rounded-lg px-2 py-2
               hover:bg-gray-100">
              <img src="/icons/swing-1-5.svg" class="h-8 w-8" alt="" />
            </button>

          </div>

        </div>

      </section>


      <!-- Fan Speed -->
      <section class="px-6 pt-4 pb-6">

        <p class="mb-2 text-xs font-medium text-slate-500">
          Fan speed
        </p>

        <div class="grid grid-cols-5 gap-1
           rounded-xl
           bg-slate-900/5
           p-1">

          <!-- Auto -->
          <label>
            <input type="radio" name="fan" class="peer sr-only" />

            <div id="fan-auto" class="cursor-pointer rounded-lg
               py-2.5
               text-center text-xs font-medium
               text-slate-500
               transition
               hover:bg-slate-100
               peer-checked:bg-slate-200
               peer-checked:text-slate-700
               peer-checked:shadow-sm">
              Auto
            </div>
          </label>


          <!-- Low -->
          <label>
            <input type="radio" name="fan" class="peer sr-only" />

            <div id="fan-low" class="cursor-pointer rounded-lg
               py-2.5
               text-center text-xs font-medium
               text-slate-500
               transition
               hover:bg-blue-50
               peer-checked:bg-blue-100
               peer-checked:text-blue-700
               peer-checked:shadow-sm">
              Low
            </div>
          </label>


          <!-- Medium -->
          <label>
            <input type="radio" name="fan" class="peer sr-only" />

            <div id="fan-medium" class="cursor-pointer rounded-lg
               py-2.5
               text-center text-xs font-medium
               text-slate-500
               transition
               hover:bg-sky-50
               peer-checked:bg-sky-100
               peer-checked:text-sky-700
               peer-checked:shadow-sm">
              Medium
            </div>
          </label>


          <!-- High -->
          <label>
            <input type="radio" name="fan" class="peer sr-only" />

            <div id="fan-high" class="cursor-pointer rounded-lg
               py-2.5
               text-center text-xs font-medium
               text-slate-500
               transition
               hover:bg-orange-50
               peer-checked:bg-orange-100
               peer-checked:text-orange-700
               peer-checked:shadow-sm">
              High
            </div>
          </label>


          <!-- Turbo -->
          <label>
            <input type="radio" name="fan" class="peer sr-only" />

            <div id="fan-turbo" class="cursor-pointer rounded-lg
               py-2.5
               text-center text-xs font-semibold
               text-slate-500
               transition
               hover:bg-red-50
               peer-checked:bg-red-100
               peer-checked:text-red-700
               peer-checked:shadow-sm">
              Turbo
            </div>
          </label>

        </div>

      </section>


    </div>

  </main>

</body>

</html>
